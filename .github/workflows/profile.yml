name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *"        # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: |
          pip install fonttools
          python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
